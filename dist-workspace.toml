[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# One package. That install provides both mb_client and mb_server.
packages = ["mb-rs"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-unknown-linux-musl", "armv7-unknown-linux-musleabihf", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
# Unix archive format
unix-archive = ".tar.gz"
# cargo-dist 0.33 uses ubuntu-22.04 for Linux and global jobs.
